<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="ig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <mask id="im">
      <rect x="4" y="8" width="56" height="48" rx="10" fill="white"/>
      <circle cx="4"  cy="32" r="7" fill="black"/>
      <circle cx="60" cy="32" r="7" fill="black"/>
    </mask>
    <clipPath id="ic">
      <rect x="4" y="8" width="56" height="48" rx="10"/>
    </clipPath>
  </defs>

  <!-- Gradient ticket with transparent notch cutouts -->
  <rect width="64" height="64" fill="url(#ig)" mask="url(#im)"/>

  <!-- Exchange arrows, clipped to ticket bounds -->
  <g clip-path="url(#ic)" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5">
    <!-- Arrow going right (top) -->
    <line x1="14" y1="25" x2="42" y2="25"/>
    <polyline points="36,19 43,25 36,31"/>

    <!-- Arrow going left (bottom) -->
    <line x1="50" y1="39" x2="22" y2="39"/>
    <polyline points="28,33 21,39 28,45"/>
  </g>
</svg>
