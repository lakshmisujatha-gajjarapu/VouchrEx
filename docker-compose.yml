services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${PORT}:${PORT}"
    environment:
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CODE_ENCRYPTION_KEY: ${CODE_ENCRYPTION_KEY}
      RAZORPAY_PAYMENT_CALLBACK_URL: ${RAZORPAY_PAYMENT_CALLBACK_URL}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      RAZORPAY_X_KEY_ID: ${RAZORPAY_X_KEY_ID}
      RAZORPAY_X_KEY_SECRET: ${RAZORPAY_X_KEY_SECRET}
      RAZORPAY_X_ACCOUNT_NUMBER: ${RAZORPAY_X_ACCOUNT_NUMBER}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      OTP_PROVIDER: ${OTP_PROVIDER}
      OTP_FIXED_CODE: ${OTP_FIXED_CODE}
      OTP_TTL_MINUTES: ${OTP_TTL_MINUTES}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m

  db:
    image: postgres:16
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: vouchrex_user
      POSTGRES_DB: vouchrex_db
      POSTGRES_PASSWORD: change_me_strong_password
    restart: always
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vouchrex_user -d vouchrex_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes --requirepass change_me_strong_password
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "change_me_strong_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prisma-studio:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: yarn exec prisma studio --port 5555 --browser none
    ports:
      - "127.0.0.1:5555:5555"   # localhost only — never expose to internet
    environment:
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      CODE_ENCRYPTION_KEY: ${CODE_ENCRYPTION_KEY}
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - dev  # only starts with: docker compose --profile dev up

volumes:
  pgdata:
  redisdata:
