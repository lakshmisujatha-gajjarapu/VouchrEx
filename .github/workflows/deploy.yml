name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]
      image_tag:
        description: Image tag to deploy (e.g. latest, v1.2.3)
        required: true
        default: latest

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy → ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    env:
      ENV_NAME:  ${{ github.event.inputs.environment }}
      IMAGE_TAG: ${{ github.event.inputs.image_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.API_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key ec2-user@"${{ secrets.API_HOST }}" bash << 'ENDSSH'
            set -euo pipefail
            cd /opt/vouchrex

            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/vouchrex-api:${{ env.IMAGE_TAG }}"
            echo "Deploying image: $IMAGE"

            # Update image tag in compose file
            sed -i "s|image: .*/vouchrex-api:.*|image: $IMAGE|" docker-compose.yml

            docker compose pull api
            docker compose up -d --remove-orphans
            docker system prune -f
          ENDSSH

      - name: Health check
        run: |
          for i in $(seq 1 15); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
              "http://${{ secrets.API_HOST }}/health" || echo "000")
            [ "${STATUS}" = "200" ] && { echo "Health check passed"; exit 0; }
            echo "  [${i}/15] HTTP ${STATUS} — waiting..."
            sleep 10
          done
          echo "Health check failed after 150s"
          exit 1
