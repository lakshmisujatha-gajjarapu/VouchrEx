name: Deploy

on:
  push:
    branches: [main]          # push to main → staging automatically
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy → ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}

    env:
      ENV_NAME:  ${{ github.event.inputs.environment || 'staging' }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      # ── Docker Hub login ──────────────────────────────────────────────────────
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Build + push to Docker Hub ────────────────────────────────────────────
      # Two tags:
      #   username/couponbazaar-api:<git-sha>       — immutable, pinnable
      #   username/couponbazaar-api:staging-latest  — mutable, what the VPS pulls
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/couponbazaar-api:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/couponbazaar-api:${{ env.ENV_NAME }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── SSH setup ─────────────────────────────────────────────────────────────
      # API_HOST is the static IP output from `terraform output api_public_ip`.
      # SSH_PRIVATE_KEY is the private key matching the public key in Terraform.
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.API_HOST }}" >> ~/.ssh/known_hosts

      # ── Deploy ────────────────────────────────────────────────────────────────
      # Pull the new env-latest image and restart the compose stack.
      # docker system prune removes dangling images to keep disk usage low.
      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/deploy_key ec2-user@"${{ secrets.API_HOST }}" \
            "cd /opt/couponbazaar && \
             docker compose pull && \
             docker compose up -d --remove-orphans && \
             docker system prune -f"

      # ── Health check ──────────────────────────────────────────────────────────
      # Hits the VPS directly (bypasses Cloudflare) so DNS propagation doesn't
      # affect CI. Use API_HOST + port 80 (nginx listens on 80).
      - name: Health check
        run: |
          for i in $(seq 1 15); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
              "http://${{ secrets.API_HOST }}/health" || echo "000")
            [ "${STATUS}" = "200" ] && { echo "Health check passed"; exit 0; }
            echo "  [${i}/15] HTTP ${STATUS} — waiting..."
            sleep 10
          done
          echo "Health check failed after 150s"
          exit 1
