name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]
      image_tag:
        description: Image tag to deploy (git SHA or branch-latest)
        required: true
        default: main-latest

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy → ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    env:
      ENV_NAME:  ${{ github.event.inputs.environment }}
      IMAGE_TAG: ${{ github.event.inputs.image_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.API_HOST }}" >> ~/.ssh/known_hosts

      - name: Run migrations
        run: |
          ssh -i ~/.ssh/deploy_key ec2-user@"${{ secrets.API_HOST }}" \
            "cd /opt/vouchrex && \
             IMAGE_TAG=${{ env.IMAGE_TAG }} docker compose pull && \
             IMAGE_TAG=${{ env.IMAGE_TAG }} docker compose run --rm --no-deps api \
               node node_modules/.bin/prisma migrate deploy"

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key ec2-user@"${{ secrets.API_HOST }}" \
            "cd /opt/vouchrex && \
             IMAGE_TAG=${{ env.IMAGE_TAG }} docker compose up -d --remove-orphans && \
             docker system prune -f"

      - name: Health check
        run: |
          for i in $(seq 1 15); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
              "http://${{ secrets.API_HOST }}/health" || echo "000")
            [ "${STATUS}" = "200" ] && { echo "Health check passed"; exit 0; }
            echo "  [${i}/15] HTTP ${STATUS} — waiting..."
            sleep 10
          done
          echo "Health check failed after 150s"
          exit 1
