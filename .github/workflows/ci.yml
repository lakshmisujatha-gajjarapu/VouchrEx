name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint · TypeCheck · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate Prisma client
        run: yarn workspace vouchrex-api prisma generate

      - name: Lint
        run: yarn lint

      - name: TypeCheck
        run: yarn typecheck

      - name: Test
        run: yarn test

  docker:
    name: Build & push API image
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set build metadata
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short "${{ github.sha }}")
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "TAG_LATEST=true" >> $GITHUB_ENV
          else
            echo "TAG_LATEST=false" >> $GITHUB_ENV
          fi

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/vouchrex-api
          tags: |
            type=ref,event=branch,suffix=-${{ env.SHORT_SHA }}
            type=raw,value=${{ env.SHORT_SHA }}
            ${{ env.TAG_LATEST == 'true' && 'type=raw,value=latest' || '' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
