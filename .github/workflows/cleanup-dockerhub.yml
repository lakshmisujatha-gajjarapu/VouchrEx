name: Cleanup DockerHub tags

on:
  schedule:
    - cron: '0 0 * * 0'  # every Sunday midnight UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete unversioned tags
    runs-on: ubuntu-latest
    steps:
      - name: Delete non-semver, non-latest tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          TOKEN=$(curl -s -X POST "https://hub.docker.com/v2/users/login" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$DOCKERHUB_USERNAME\",\"password\":\"$DOCKERHUB_TOKEN\"}" \
            | jq -r .token)

          TAGS=$(curl -s "https://hub.docker.com/v2/repositories/$DOCKERHUB_USERNAME/vouchrex-api/tags/?page_size=100" \
            -H "Authorization: Bearer $TOKEN" | jq -r '.results[].name')

          for tag in $TAGS; do
            if [[ "$tag" == "latest" ]] || [[ "$tag" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              echo "Keeping $tag"
            else
              echo "Deleting $tag..."
              curl -s -X DELETE \
                "https://hub.docker.com/v2/repositories/$DOCKERHUB_USERNAME/vouchrex-api/tags/$tag/" \
                -H "Authorization: Bearer $TOKEN"
            fi
          done
