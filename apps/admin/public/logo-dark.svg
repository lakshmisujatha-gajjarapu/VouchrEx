<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 64" width="272" height="64" fill="none">
  <defs>
    <linearGradient id="ldg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <mask id="ldm">
      <rect x="4" y="8" width="50" height="48" rx="9" fill="white"/>
      <circle cx="4"  cy="32" r="6.5" fill="black"/>
      <circle cx="54" cy="32" r="6.5" fill="black"/>
    </mask>
    <clipPath id="ldc">
      <rect x="4" y="8" width="50" height="48" rx="9"/>
    </clipPath>
  </defs>

  <!-- Ticket icon -->
  <rect width="58" height="64" fill="url(#ldg)" mask="url(#ldm)"/>

  <!-- Exchange arrows -->
  <g clip-path="url(#ldc)" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
    <line x1="12" y1="25" x2="38" y2="25"/>
    <polyline points="33,20 39,25 33,30"/>
    <line x1="46" y1="39" x2="20" y2="39"/>
    <polyline points="25,34 19,39 25,44"/>
  </g>

  <!-- Wordmark on dark background -->
  <text
    x="70" y="32"
    dominant-baseline="central"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="26">
    <tspan font-weight="700" fill="white">Voucher</tspan><tspan font-weight="800" fill="#a78bfa">Ex</tspan>
  </text>
</svg>
