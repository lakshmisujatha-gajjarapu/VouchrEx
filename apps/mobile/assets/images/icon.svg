<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#1E1050"/>
    </linearGradient>
    <radialGradient id="shine" cx="28%" cy="18%" r="68%">
      <stop offset="0%" stop-color="white" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="44" fill="url(#bg)"/>
  <rect width="200" height="200" rx="44" fill="url(#shine)"/>

  <!--
    Ticket shape: horizontal coupon with semicircle notches on left & right
    Dimensions: x=18→182 (164px wide), y=63→137 (74px tall)
    Notch radius: 13, centered at y=100
    Corner radius: 10
  -->
  <path d="
    M 28,63
    L 172,63
    Q 182,63 182,73
    L 182,87
    A 13,13 0 0,0 182,113
    L 182,127
    Q 182,137 172,137
    L 28,137
    Q 18,137 18,127
    L 18,113
    A 13,13 0 0,0 18,87
    L 18,73
    Q 18,63 28,63
    Z
  " fill="white" opacity="0.97"/>

  <!-- Perforated tear line (vertical center) -->
  <line x1="100" y1="67" x2="100" y2="133"
    stroke="#6D28D9" stroke-width="1.5"
    stroke-dasharray="5,4.5" opacity="0.25"/>

  <!--
    Exchange arrows (emerald) — communicate P2P / swap / marketplace
    Arrow 1: points RIGHT  (top)
    Arrow 2: points LEFT   (bottom)
  -->

  <!-- Arrow 1: → (top, left to right) -->
  <path d="M 38,90 L 148,90"
    stroke="#34D399" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M 134,77 L 148,90 L 134,103"
    fill="none" stroke="#34D399" stroke-width="6.5"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arrow 2: ← (bottom, right to left) -->
  <path d="M 162,110 L 52,110"
    stroke="#34D399" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M 66,97 L 52,110 L 66,123"
    fill="none" stroke="#34D399" stroke-width="6.5"
    stroke-linecap="round" stroke-linejoin="round"/>
</svg>
