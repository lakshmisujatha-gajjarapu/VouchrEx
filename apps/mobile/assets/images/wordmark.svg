<!-- VouchrEx wordmark — icon mark + logotype -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 80">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
  </defs>

  <!-- Icon badge -->
  <rect x="0" y="0" width="80" height="80" rx="18" fill="url(#bg)"/>

  <!-- V (scaled to 80x80) -->
  <path d="M9,18 L23,61 L37,18"
    fill="none" stroke="white" stroke-width="6"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- x crown (scaled) — center at (59,47) -->
  <line x1="59" y1="47" x2="43" y2="15" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <line x1="59" y1="47" x2="75" y2="15" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <line x1="59" y1="47" x2="45" y2="66" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <line x1="59" y1="47" x2="73" y2="66" stroke="white" stroke-width="6" stroke-linecap="round"/>

  <!-- Gem -->
  <circle cx="59" cy="47" r="4"   fill="#34D399" opacity="0.95"/>
  <circle cx="59" cy="47" r="2.2" fill="#A7F3D0"/>

  <!-- Logotype: "Vouchr" regular + "Ex" accent -->
  <!-- Requires Manrope font loaded in context -->
  <text x="98" y="54"
    font-family="Manrope, system-ui, sans-serif"
    font-size="40" font-weight="700"
    fill="white" letter-spacing="-0.5">Vouchr</text>

  <text x="318" y="54"
    font-family="Manrope, system-ui, sans-serif"
    font-size="40" font-weight="800"
    fill="#A78BFA" letter-spacing="-0.5">Ex</text>
</svg>
