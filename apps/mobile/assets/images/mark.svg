    fill="none" stroke="currentColor" stroke-width="15"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- x (crown proportions) — center at (126, 80) -->
  <line x1="126" y1="80" x2="84"  y2="0"   stroke="currentColor" stroke-width="15" stroke-linecap="round"/>
  <line x1="126" y1="80" x2="168" y2="0"   stroke="currentColor" stroke-width="15" stroke-linecap="round"/>
  <line x1="126" y1="80" x2="91"  y2="127" stroke="currentColor" stroke-width="15" stroke-linecap="round"/>
  <line x1="126" y1="80" x2="161" y2="127" stroke="currentColor" stroke-width="15" stroke-linecap="round"/>

  <!-- Gem -->
  <circle cx="126" cy="80" r="9" fill="#34D399" opacity="0.95"/>
  <circle cx="126" cy="80" r="5" fill="#A7F3D0"/>
</svg>
